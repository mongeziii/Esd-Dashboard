services:
  - type: web
    name: esg-decision-dashboard
    runtime: python
    plan: free
    rootDir: esg_dashboard
    buildCommand: "pip install -r requirements.txt"
    startCommand: "streamlit run app.py --server.port=$PORT --server.address=0.0.0.0 --server.headless=true"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
